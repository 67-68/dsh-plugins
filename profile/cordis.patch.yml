# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- insert:
    # Persistent mode-experience injector: reads DOCUMENT/{mode}.md at boot and
    # injects GENERAL.md into every non-gated mode's system prompt, and parses
    # every {mode}.md into on-demand skills. Promote-gated modes
    # (anchored-architect) get their GENERAL + mode file through the preset's
    # complete-persona plugin (persona-gated.mjs) instead, so their mode
    # experience arrives as SYSTEM prompt text after promotion.
    - id: mode-experience
      name: './mode-experience.mjs'
      config:
        docDir: '~/.dsh/DOCUMENT'
        promoteGatedModes: ['anchored-architect']

    # Mode gate: host half declares `declare_target` / `switch_mode` tools and
    # enforces READ_ONLY / PLAN_ONLY / WRITE_ENABLED on `tools/pre-execute`;
    # the browser half renders the mode-permission settings tab.
    - id: mode-gate
      name: 'dsh-mode-gate'
      config:
        defaultMode: READ_ONLY

    # Per-mode plugin inventory (dual-face package `dsh-permode-inventory`).
    # The node half (lib/index.js) reads each whitelisted preset's
    # agent.cordis.yml and exposes its plugin rows through the `permodeInventory`
    # Remote service; the browser half (lib/client.js, declared by the package's
    # `dsh.client`) renders them into the Plugins settings "modes" tab. One row
    # serves both halves: the host loader mounts the node half, and
    # dsh-client-modules scans the same row for the `dsh.client` bundle.
    - id: permode-inventory
      name: 'dsh-permode-inventory'
      config:
        presetIds: ['architect', 'g-chat', 'cordis-architect', 'code']

    # Music alert (dual-face package `dsh-music-alert`): auto-plays the default
    # sound on turn completion, exposes `play_music` + the `play-music` skill,
    # and renders an upload/list/play/delete settings tab. One row serves both
    # halves: the host loader mounts the node half (lib/index.js), and
    # dsh-client-modules scans the same row for the `dsh.client` bundle.
    - id: music-alert
      name: 'dsh-music-alert'
      config:
        musicDir: '~/.dsh/music'
        enabled: true

    # Mermaid diagram renderer (dual-face package `dsh-mermaid`): the node
    # half (lib/index.js) serves the bundled mermaid engine as a static IIFE
    # asset; the browser half (lib/client.js, declared by the package's
    # `dsh.client`) loads it and renders whitelisted ```mermaid code blocks
    # into SVG after the message settles. One row serves both halves.
    - id: dsh-mermaid
      name: 'dsh-mermaid'
      config: {}

    # Session icon marker (dual-face package `dsh-icon-marker`): the node half
    # registers the `dsh-icon-marker` settings namespace; the browser half
    # renders per-session unicode icons in the sidebar, FSM state mapping,
    # output regex auto rules, and the hide-native-status-dot setting.
    - id: icon-marker
      name: 'dsh-icon-marker'
      config: {}

# dsh-plugin-manager:managed:start
- insert:
    - id: dsh-read-url
      name: 'dsh-read-url'
