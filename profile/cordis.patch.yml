# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- insert:
    # Persistent mode-experience injector: reads DOCUMENT/{mode}.md at boot and
    # injects GENERAL.md into every non-gated mode's system prompt, and parses
    # every {mode}.md into on-demand skills. Promote-gated modes
    # (anchored-architect) get their GENERAL + mode file through the preset's
    # complete-persona plugin (persona-gated.mjs) instead, so their mode
    # experience arrives as SYSTEM prompt text after promotion.
    - id: mode-experience
      name: './mode-experience.mjs'
      config:
        docDir: '~/.dsh/DOCUMENT'
        promoteGatedModes: ['anchored-architect']

    # Mode gate: flat multi-workflow state machine (IDLE / SIMPLE-ACTION /
    # CREATE). The host half registers the workflow registry, goal engine,
    # feature-intent/project-experience tools and tool interception; the browser
    # half renders the IDLE workflow modal, composer placeholder, header toggle
    # and the settings tab.
    # NOTE: feature intent 不再有全局目录配置：它是项目文件（类似 AGENT.md），
    # 固定放在项目根目录下的 feature_intents/（唯一规范位置）。
    # session 的 workspace 即项目根；workspace 若是多项目容器，则每个子项目根
    # 下的 feature_intents/ 会被发现并挂载。都没有就在 <workspace>/feature_intents
    # 自动创建。其余长期记忆（features / patterns / journal / history /
    # architecture.md）作为该项目根的兄弟路径一起派生。
    - id: mode-gate
      name: 'dsh-mode-gate'
      config:
        presetActionDir: '~/.dsh/preset-actions'

    # Per-mode plugin inventory (dual-face package `dsh-permode-inventory`).
    # The node half (lib/index.js) reads each whitelisted preset's
    # agent.cordis.yml and exposes its plugin rows through the `permodeInventory`
    # Remote service; the browser half (lib/client.js, declared by the package's
    # `dsh.client`) renders them into the Plugins settings "modes" tab. One row
    # serves both halves: the host loader mounts the node half, and
    # dsh-client-modules scans the same row for the `dsh.client` bundle.
    - id: permode-inventory
      name: 'dsh-permode-inventory'
      config:
        presetIds: ['architect', 'g-chat', 'cordis-architect', 'code']

    # Music alert (dual-face package `dsh-music-alert`): auto-plays the default
    # sound on turn completion, exposes `play_music` + the `play-music` skill,
    # and renders an upload/list/play/delete settings tab. One row serves both
    # halves: the host loader mounts the node half (lib/index.js), and
    # dsh-client-modules scans the same row for the `dsh.client` bundle.
    - id: music-alert
      name: 'dsh-music-alert'
      config:
        musicDir: '~/.dsh/music'
        enabled: true

    # Mermaid diagram renderer (dual-face package `dsh-mermaid`): the node
    # half (lib/index.js) serves the bundled mermaid engine as a static IIFE
    # asset; the browser half (lib/client.js, declared by the package's
    # `dsh.client`) loads it and renders whitelisted ```mermaid code blocks
    # into SVG after the message settles. One row serves both halves.
    - id: dsh-mermaid
      name: 'dsh-mermaid'
      config: {}

    # Session icon marker (dual-face package `dsh-icon-marker`): the node half
    # registers the `dsh-icon-marker` settings namespace; the browser half
    # renders per-session unicode icons in the sidebar, FSM state mapping,
    # output regex auto rules, and the hide-native-status-dot setting.
    - id: icon-marker
      name: 'dsh-icon-marker'
      config: {}

    # Old-session importer (host plugin `dsh-session-converter`): scans
    # ~/.dsh/sessions for v0/v3 session logs, registers the model-visible
    # `import_session` tool (user/agent final replies as background text) and
    # the user-facing `/import` command (lists importable sessions).
    - id: session-converter
      name: 'dsh-session-converter'
      config:
        sessionsDir: '~/.dsh/sessions'
        maxChars: 200000
        includeReasoning: false

    # Trajectory notes (host plugin `dsh-trajectory-notes`): registers the
    # model-visible tools list_trajectories / read_trajectory /
    # summarize_trajectory. A trajectory = one turn of a session, read
    # read-only through ctx.sessionQuery (the append-only session log is never
    # written); each entry is summarized through ctx.llm.stream, so the summary
    # model routes independently of the conversation model.
    # NOTE: global tool registration alone is invisible to the model — the host
    # presses the global layer down to built-ins via an allow restriction, and
    # restrictions only narrow — so the tools are re-registered into each agent
    # scope on agent/created.
    - id: trajectory-notes
      name: 'dsh-trajectory-notes'
      config: {}

# DeepSeek official catalog: keep the shipped defaults and add the V4.1 Flash
# limited-beta route (API model id expires 2026-09-10). The settings layer
# (`llm-deepseek:` in $DSH_HOME/settings.yaml) can still override this list.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    models:
      - id: deepseek-v4-flash
        name: DeepSeek-V4-Flash
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
      - id: deepseek-v4.1-flash-expires-on-0910
        name: "DeepSeek-V4.1-Flash 试用版（9/10 到期）"

# dsh-plugin-manager:managed:start
- insert:
    - id: dsh-read-url
      name: 'dsh-read-url'
# dsh-plugin-manager:managed:end

# ── Managed MCP servers (dsh-skill-mcp-manager, disabled shadow entries) ──
# ── End managed MCP servers (dsh-skill-mcp-manager) ──

# caob23/dsh-browser-control: bundle 自带 enabled:false；用户层显式覆盖为 true，
# 让 bridge 监听 127.0.0.1:9777。重启 dsh web 后生效（若 HMR 已应用则无需重启）。
- id: browser-bridge
  config:
    enabled: true
    port: 9777
    token: dsh-local

# 重新启用 host plane 的 compaction-basic：dsh-web-app bundle 默认 disabled: true
# （compaction backend 移到 preset 层），但 dsh-mode-gate 在 host plane 上 inject
# 了 compaction 服务，host plane 缺它会导致插件树加载失败（waiting for service:
# compaction）。用户层在 web-app 之后应用，可覆盖该禁用。依赖 llm / tokenMeter /
# sessions 在 host plane 均可用。
- id: compaction-basic
  disabled: false
