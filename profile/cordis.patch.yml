# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- insert:
    # Persistent mode-experience injector: reads DOCUMENT/{mode}.md at boot and
    # injects the active preset's file into every system-prompt assembly.
    - id: mode-experience
      name: './mode-experience.mjs'
      config:
        docDir: !!js dshHomePath('DOCUMENT')
