# `architect` preset — 架构设计模式。
# persona 原文从 persona.md 读取（cp 自 archetect.md + diff 工具名映射）。
# 只读检索 + 规划工具；严禁写业务代码（persona 内约束禁用 write/edit）。

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: !!js "process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:url').fileURLToPath(new URL('persona.md', baseUrl)), 'utf8')"

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    search: true
    fetch: false

# ── delegation ──────────────────────────────────────────────────────────────
# `subagents` registry + spawn/fork backends 在 host composition（base bundle）已启用；
# 这里注册面向模型的委派工具，它们解析 host 的 registry（不提供 service，无需 isolate realm）。
# persona 的「AI Offloading & Delegation Protocol」要求使用 `subagent` 委派体力活。
- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: tool-subagent-list-agents
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable

- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: continuable
